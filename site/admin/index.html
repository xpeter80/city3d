<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 连接智能</title><link rel="stylesheet" href="/shared.css"></head><body><nav class="site-nav"><a class="logo" href="/"><img src="/assets/logo.png" alt="CHAIN NOVA">连接智能</a><span class="nav-spacer"></span><a href="/account/">个人中心</a></nav><main class="wrap"><h1>作品展管理后台</h1><p id="status" class="error" role="status"></p><div id="content" hidden><div class="metric-grid" id="metrics"></div><div class="tabs" id="tabs"><button data-tab="users">用户</button><button data-tab="notes">留言</button><button data-tab="config">参数</button><button data-tab="logs">系统日志</button></div><div class="panel"><form id="filters" class="row"><input name="q" placeholder="搜索用户名 / 留言"><select name="city"><option value="">全部城市</option><option value="hangzhou">杭州</option><option value="chengdu">成都</option></select><input name="place" placeholder="景点编号（从0起）" size="14"><input name="user_id" placeholder="用户ID" size="8"><button>查询</button></form><div id="table" class="table-wrap"></div><div class="pager" id="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><form id="config-form" hidden><h2>上传限制</h2><div class="row"><label>图片 MB<input name="image" type="number" min="1" max="200" required></label><label>音频 MB<input name="audio" type="number" min="1" max="200" required></label><label>视频 MB<input name="video" type="number" min="1" max="200" required></label></div><label>敏感词（每行一个，最多1000条）<textarea name="words" rows="10" style="display:block;width:100%"></textarea></label><p class="muted">检查用户名及留言文字，不包括图片、音视频内容。</p><button>保存并立即生效</button></form></div></div></main><dialog id="preview"><button id="close-preview" class="quiet">关闭 ×</button><div id="preview-body"></div></dialog><script type="module" src="/admin/admin.js"></script></body></html>
